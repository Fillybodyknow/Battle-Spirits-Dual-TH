<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // จอเล็ก (มือถือ/แท็บเล็ต): ให้เบราว์เซอร์ย่อทั้งหน้าลงจากความกว้าง 1280px (กระดานออกแบบไว้สำหรับจอกว้าง)
      (function () {
        var w = Math.max(screen.width, screen.height);
        if (w < 1280) document.querySelector('meta[name=viewport]').setAttribute('content', 'width=1280, viewport-fit=cover');
      })();
    </script>
    <title>Battle Spirits Dual TH</title>
    <meta name="description" content="เกมการ์ด Battle Spirits ภาษาไทย เล่นเครื่องเดียวหรือดวลออนไลน์" />
    <meta name="theme-color" content="#0b1530" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <!-- iOS: เพิ่มไปยังหน้าจอโฮม แล้วเปิดเต็มจอแบบแอป -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BS Dual" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
