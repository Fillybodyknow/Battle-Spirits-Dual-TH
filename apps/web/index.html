<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // จอเล็ก/จอสัมผัส (มือถือ, iPad): ให้เบราว์เซอร์ย่อทั้งหน้า ให้กระดาน (ออกแบบไว้ 1280 x 860) พอดีจอทั้งกว้างและสูง
      // แนวนอน: เลือกความกว้างของหน้าให้ความสูงไม่ต่ำกว่า __fitH (กระดานเกม 860, หน้าเมนูน้อยกว่า = ใหญ่ขึ้น) · แนวตั้ง: ขึ้นป้ายให้หมุนจอ
      (function () {
        var meta = document.querySelector('meta[name=viewport]');
        window.__fitH = 860;
        function fit() {
          var sw = screen.width, sh = screen.height;
          var landscape = window.matchMedia('(orientation: landscape)').matches;
          var w = landscape ? Math.max(sw, sh) : Math.min(sw, sh);
          var h = landscape ? Math.min(sw, sh) : Math.max(sw, sh);
          var coarse = window.matchMedia('(pointer: coarse)').matches;
          var content = 'width=device-width, initial-scale=1.0, viewport-fit=cover';
          if (coarse || w < 1280) {
            var width = landscape ? Math.max(1280, Math.ceil((window.__fitH * w) / h)) : 1280;
            content = 'width=' + width + ', viewport-fit=cover';
          }
          if (meta.getAttribute('content') !== content) meta.setAttribute('content', content);
        }
        fit();
        window.__refit = fit;
        window.addEventListener('orientationchange', function () { setTimeout(fit, 250); });
        window.addEventListener('resize', fit);
      })();
    </script>
    <title>Battle Spirits Duel TH</title>
    <meta name="description" content="เกมการ์ด Battle Spirits ภาษาไทย เล่นเครื่องเดียวหรือดวลออนไลน์" />
    <meta name="theme-color" content="#0b1530" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <!-- iOS: เพิ่มไปยังหน้าจอโฮม แล้วเปิดเต็มจอแบบแอป -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BS Dual" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
